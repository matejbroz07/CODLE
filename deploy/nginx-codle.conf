# Codle on nginx + PHP-FPM. Mirrors the .htaccess rules (nginx ignores .htaccess).
# Public traffic arrives through the Cloudflare Tunnel in this VM (app.codle.eu -> http://127.0.0.1:80),
# so TLS ends at Cloudflare and nginx listens on port 80 only.

map $uri $codle_cache {
    ~*\.(html|css|js|webmanifest)$          "no-cache";
    ~*\.(png|jpe?g|gif|svg|ico|woff2?)$     "public, max-age=604800";
    default                                 "";
}

# HSTS only for requests that came over HTTPS (Cloudflare sets X-Forwarded-Proto).
map $http_x_forwarded_proto $codle_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/matejbroz/public;
    # The public home page answers on /, the app itself is index.html.
    index home.html index.html index.php;
    charset utf-8;
    client_max_body_size 20m;
    server_tokens off;

    access_log /var/log/nginx/matejbroz.access.log;
    error_log /var/log/nginx/matejbroz.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control $codle_cache;
    add_header Strict-Transport-Security $codle_hsts always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    error_page 404 /404.php;

    # Visitors who reached Cloudflare over plain HTTP go to HTTPS. Direct access (no header) is untouched.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Certificates (certbot) may use this; every other dotfile stays hidden.
    location ^~ /.well-known/ { try_files $uri =404; }
    location ~ /\. { deny all; }

    # Schema, seeds, content sources and docs are not for the web.
    location ^~ /database/ { deny all; }
    location ~* \.(md|sql|code-workspace|ya?ml)$ { deny all; }

    # API: every request goes to the front controller, internals stay closed.
    location ^~ /api/ {
        location ~ ^/api/(lib|routes|tools)/ { deny all; }
        location ~ ^/api/config { deny all; }
        location ~* \.(md|sql|ya?ml)$ { deny all; }
        location = /api/index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/run/php/matejbroz.sock;
            fastcgi_hide_header X-Powered-By;
        }
        location ~ \.php$ { deny all; }
        try_files $uri /api/index.php$is_args$args;
    }

    # Admin: its PHP pages run, libraries, tools and the config do not.
    location ^~ /admin/ {
        location ~ ^/admin/(lib|tools)/ { deny all; }
        location ~ ^/admin/config { deny all; }
        location ~* \.(md|sql|ya?ml)$ { deny all; }
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/run/php/matejbroz.sock;
            fastcgi_hide_header X-Powered-By;
        }
        try_files $uri $uri/ =404;
    }

    # Profile pictures: only <id>-<12 hex>.jpg, never code.
    location ^~ /uploads/avatars/ {
        location ~ "^/uploads/avatars/[0-9]+-[0-9a-f]{12}\.jpg$" {
            types { }
            default_type image/jpeg;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        return 404;
    }

    # "Page not found" with Curly.
    location = /404.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/matejbroz.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP file runs.
    location ~* \.php(?:$|/) { return 404; }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
